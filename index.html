<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Premium Voice Dispatch & Analytics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@1.0.0/dist/vapi.js"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #141417;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .nav-item.active, .nav-item:hover {
            background-color: #27272a80;
            color: var(--text-main);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.5rem;
            padding: 1.5rem;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            background-color: #09090b;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: none;
            flex: 1;
            min-height: 150px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background-color: #09090b;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .dot.active {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        .transcript-container {
            flex: 1;
            background-color: #09090b;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .bubble {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in-out;
        }

        .bubble.ai {
            background-color: #27272a80;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
            border-left: 3px solid var(--accent);
        }

        .bubble.user {
            background-color: #1d4ed820;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
            border-right: 3px solid #3b82f6;
        }

        .speaker-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .intercept-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-secondary {
            background-color: #27272a;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: #3f3f46;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background-color: var(--accent);
            border-radius: 3px;
            animation: bounce 1s ease-in-out infinite;
            display: none;
        }

        .barge-active {
            border-color: var(--success) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-brain" style="color: var(--accent);"></i>
            <span>NEXUS.AI</span>
        </div>
        <a href="#" class="nav-item active"><i class="fa-solid fa-phone-volume"></i> Outbound Engine</a>
    </div>

    <div class="main-container">
        <header>
            <div style="font-weight: 500;">Console / Outbound Engine</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">GitHub Pages Deployment</div>
        </header>

        <div class="workspace">
            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-sliders" style="color: var(--accent)"></i> Call Configuration
                </div>
                
                <div class="form-group">
                    <label for="vapi-key">Vapi Public Key (Paste Here)</label>
                    <input type="password" id="vapi-key" placeholder="publicKey_example12345...">
                </div>

                <div class="form-group">
                    <label for="phone-number">Target Phone Number</label>
                    <input type="tel" id="phone-number" placeholder="+1234567890">
                </div>

                <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
                    <label for="script">AI Agent Script Instruction (Paste Here)</label>
                    <textarea id="script" placeholder="Paste your custom script or system instructions here...">You are a helpful customer service assistant. State your purpose clearly and respond contextually to whatever the person says.</textarea>
                </div>

                <button class="btn" id="start-call-btn" onclick="startRealVoIPCall()">
                    <i class="fa-solid fa-bolt"></i> Launch AI Call
                </button>
            </div>

            <div class="panel" id="dashboard-panel">
                <div class="panel-title" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fa-solid fa-satellite-dish" style="color: var(--accent)"></i> Live Call Dashboard
                    </div>
                    <div class="wave-container" id="wave-visualizer">
                        <div class="wave-bar" style="animation-delay: 0.1s"></div>
                        <div class="wave-bar" style="animation-delay: 0.3s"></div>
                        <div class="wave-bar" style="animation-delay: 0.5s"></div>
                        <div class="wave-bar" style="animation-delay: 0.2s"></div>
                    </div>
                </div>

                <div class="status-bar">
                    <div class="status-badge">
                        <div class="dot" id="status-dot"></div>
                        <span id="status-text">System Ready</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);" id="duration-counter">
                        Duration: 00:00
                    </div>
                </div>

                <div class="transcript-container" id="transcript-feed">
                    <div style="color: var(--text-muted); text-align: center; margin: auto; font-size: 0.9rem;" id="placeholder-msg">
                        <i class="fa-solid fa-headset" style="font-size: 2rem; display: block; margin-bottom: 1rem; opacity: 0.3;"></i>
                        No live call session active.
                    </div>
                </div>

                <div class="intercept-panel">
                    <button class="btn btn-secondary" id="barge-btn" onclick="toggleBargeMode()" disabled>
                        <i class="fa-solid fa-microphone"></i> Pop Into Call
                    </button>
                    <button class="btn btn-danger" id="hangup-btn" onclick="terminateCall()" disabled>
                        <i class="fa-solid fa-phone-slash"></i> End Session
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let vapiClient = null;
        let callActive = false;
        let isBargedIn = false;
        let timerInterval;
        let elapsedSeconds = 0;

        function setupVapiEventListeners() {
            if (!vapiClient) return;

            vapiClient.on('call-start', () => {
                callActive = true;
                document.getElementById('placeholder-msg').style.display = 'none';
                updateStatus("Call Live (AI Routing Active)", "var(--success)");
                document.getElementById('status-dot').classList.add('active');
                document.querySelectorAll('.wave-bar').forEach(bar => bar.style.display = 'block');
                document.getElementById('hangup-btn').disabled = false;
                document.getElementById('barge-btn').disabled = false;
                startTimer();
            });

            vapiClient.on('message', (message) => {
                if (message.type === 'transcript') {
                    if (message.transcriptType === 'partial') return; 
                    
                    const speakerType = message.role === 'assistant' ? 'ai' : 'user';
                    appendBubble(speakerType, message.transcript);

                    if (!isBargedIn) {
                        updateStatus(message.role === 'assistant' ? "AI Speaking..." : "Customer Speaking...", message.role === 'assistant' ? "var(--accent)" : "#3b82f6");
                    }
                }
            });

            vapiClient.on('call-end', () => {
                cleanUpSessionUI();
            });

            vapiClient.on('error', (error) => {
                console.error(error);
                updateStatus("API Protocol Error", "var(--danger)");
                cleanUpSessionUI();
            });
        }

        async function startRealVoIPCall() {
            const apiKey = document.getElementById('vapi-key').value.trim();
            const phoneNumber = document.getElementById('phone-number').value.trim();
            const pastedScript = document.getElementById('script').value.trim();

            if (!apiKey) {
                alert("Please paste your Vapi Public Key first.");
                return;
            }
            if (!phoneNumber) {
                alert("Please specify a target phone number.");
                return;
            }

            // Initialize or update the Vapi client instance with the entered key
            vapiClient = new Vapi(apiKey);
            setupVapiEventListeners();

            document.getElementById('start-call-btn').disabled = true;
            updateStatus("Routing outbound carrier paths...", "var(--accent)");

            try {
                await vapiClient.start({
                    phoneNumber: phoneNumber,
                    assistant: {
                        model: "gpt-4-turbo",
                        voice: "jennifer-playht", 
                        firstMessage: "Hello, this is an automated AI call assistant.",
                        systemPrompt: pastedScript 
                    }
                });
            } catch (err) {
                console.error("Session failed to launch:", err);
                updateStatus("Connection Failure", "var(--danger)");
                document.getElementById('start-call-btn').disabled = false;
            }
        }

        function toggleBargeMode() {
            if (!callActive || !vapiClient) return;

            const bargeBtn = document.getElementById('barge-btn');
            const panel = document.getElementById('dashboard-panel');

            if (!isBargedIn) {
                vapiClient.setMuted(false); 
                isBargedIn = true;
                panel.classList.add('barge-active');
                bargeBtn.innerHTML = `<i class="fa-solid fa-microphone-slash"></i> Return to AI Bot`;
                bargeBtn.style.backgroundColor = "var(--success)";
                updateStatus("Live Overtake: Your Mic Active", "var(--success)");
                appendBubble('user', "[Console Admin has stepped into the call. Microphone active.]");
            } else {
                vapiClient.setMuted(true);
                isBargedIn = false;
                panel.classList.remove('barge-active');
                bargeBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> Pop Into Call`;
                bargeBtn.style.backgroundColor = "transparent";
                updateStatus("AI Control Restored", "var(--accent)");
                appendBubble('ai', "[Console Admin left. AI has resumed parsing script.]");
            }
        }

        function terminateCall() {
            if (vapiClient) vapiClient.stop();
            cleanUpSessionUI();
        }

        function cleanUpSessionUI() {
            callActive = false;
            isBargedIn = false;
            clearInterval(timerInterval);
            
            document.getElementById('status-dot').classList.remove('active');
            updateStatus("Session Offline", "var(--danger)");
            document.getElementById('dashboard-panel').classList.remove('barge-active');
            document.querySelectorAll('.wave-bar').forEach(bar => bar.style.display = 'none');
            
            document.getElementById('start-call-btn').disabled = false;
            document.getElementById('hangup-btn').disabled = true;
            
            const bargeBtn = document.getElementById('barge-btn');
            bargeBtn.disabled = true;
            bargeBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> Pop Into Call`;
            bargeBtn.style.backgroundColor = "transparent";
        }

        function appendBubble(speaker, text) {
            const feed = document.getElementById('transcript-feed');
            const placeholder = document.getElementById('placeholder-msg');
            if(placeholder) placeholder.style.display = 'none';

            const bubble = document.createElement('div');
            bubble.className = `bubble ${speaker}`;
            
            const label = speaker === 'ai' ? 'Nexus AI Agent' : 'Customer Line';
            bubble.innerHTML = `<div class="speaker-label">${label}</div><div>${text}</div>`;
            
            feed.appendChild(bubble);
            feed.scrollTop = feed.scrollHeight;
        }

        function updateStatus(text, color) {
            const statusText = document.getElementById('status-text');
            const dot = document.getElementById('status-dot');
            statusText.innerText = text;
            dot.style.backgroundColor = color;
        }

        function startTimer() {
            elapsedSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedSeconds++;
                let min = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
                let sec = (elapsedSeconds % 60).toString().padStart(2, '0');
                document.getElementById('duration-counter').innerText = `Duration: ${min}:${sec}`;
            }, 1000);
        }
    </script>
</body>
</html>
